name: CI

on:
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "Dockerfile"
      - "pyproject.toml"
      - ".github/workflows/**"
  push:
    branches:
      - main
      - develop
      - "feature/**"
    paths:
      - "app/**"
      - "tests/**"
      - "Dockerfile"
      - "pyproject.toml"
      - ".github/workflows/**"

permissions:
  contents: read
  id-token: write

concurrency:
  group: dag-health-api-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  SERVICE_NAME: dag-health-api

jobs:
  context:
    name: Derive build context
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      should_push_image: ${{ steps.vars.outputs.should_push_image }}
    steps:
      - id: vars
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          SAFE_REF="$(echo "${GITHUB_REF_NAME}" | tr '/_' '-' | tr -cd '[:alnum:]-')"
          IMAGE_TAG="${SAFE_REF}-${SHORT_SHA}"

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" && -n "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" && -n "${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}" && -n "${{ vars.GCP_PROJECT_ID }}" && -n "${{ vars.GCP_REGION }}" ]]; then
            SHOULD_PUSH_IMAGE="true"
          else
            SHOULD_PUSH_IMAGE="false"
          fi

          echo "image_tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "should_push_image=${SHOULD_PUSH_IMAGE}" >> "${GITHUB_OUTPUT}"

  app_checks:
    name: Lint, test, and package Python app
    runs-on: ubuntu-latest
    needs: context
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev] ruff

      - name: Lint Python sources
        run: ruff check app tests

      - name: Run unit tests
        run: python -m pytest -q

      - name: Build distributable package
        run: python -m pip install build && python -m build

  docker_build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs:
      - context
      - app_checks
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build validation image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: false
          tags: local/${{ env.SERVICE_NAME }}:${{ needs.context.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish_image:
    name: Push image for deployment
    runs-on: ubuntu-latest
    needs:
      - context
      - docker_build
    if: needs.context.outputs.should_push_image == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Configure Docker for Artifact Registry
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Authorize Docker to push to Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push deployable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}-dev-repo/${{ env.SERVICE_NAME }}:${{ needs.context.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish image tag for CD
        run: |
          echo "Published image tag: ${{ needs.context.outputs.image_tag }}"
          echo "Use this tag in the CD workflow after infrastructure is provisioned."
