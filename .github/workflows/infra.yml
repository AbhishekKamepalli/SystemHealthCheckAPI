name: Infrastructure

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
      - develop
    paths:
      - "terraform/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional app image tag to use when preparing the platform. Leave blank to use the platform placeholder image."
        required: false
        default: ""
      container_image:
        description: "Optional full image URI to use when preparing the platform. Leave blank to use the platform placeholder image."
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: dag-health-api-infra-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.13.3"
  SERVICE_NAME: dag-health-api
  DEPLOY_ENVIRONMENT: dev
  TERRAFORM_ENV_DIR: terraform/environments/dev

jobs:
  validate:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TERRAFORM_ENV_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive ../../

      - name: Terraform init without backend
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ env.TERRAFORM_ENV_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Check whether plan prerequisites are configured
        id: settings
        shell: bash
        run: |
          if [[ -n "${{ vars.GCP_PROJECT_ID }}" && -n "${{ vars.GCP_REGION }}" && -n "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" && -n "${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}" ]]; then
            echo "can_auth=true" >> "${GITHUB_OUTPUT}"
          else
            echo "can_auth=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Explain skipped Terraform plan
        if: steps.settings.outputs.can_auth != 'true'
        run: |
          echo "Terraform plan was skipped because GCP auth or repository variables are not configured."

      - name: Authenticate to Google Cloud
        if: steps.settings.outputs.can_auth == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Terraform init
        if: steps.settings.outputs.can_auth == 'true'
        run: terraform init -backend=false

      - name: Terraform plan
        if: steps.settings.outputs.can_auth == 'true'
        run: |
          terraform plan \
            -input=false \
            -lock=false \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="region=${{ vars.GCP_REGION }}"

  prepare_platform:
    name: Prepare platform
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    environment: dev
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ env.TERRAFORM_ENV_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate required repository settings
        shell: bash
        run: |
          test -n "${{ vars.GCP_PROJECT_ID }}" || (echo "Missing repository variable: GCP_PROJECT_ID" && exit 1)
          test -n "${{ vars.GCP_REGION }}" || (echo "Missing repository variable: GCP_REGION" && exit 1)
          test -n "${{ vars.TF_STATE_BUCKET }}" || (echo "Missing repository variable: TF_STATE_BUCKET" && exit 1)
          test -n "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" || (echo "Missing secret: GCP_WORKLOAD_IDENTITY_PROVIDER" && exit 1)
          test -n "${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}" || (echo "Missing secret: GCP_SERVICE_ACCOUNT_EMAIL" && exit 1)

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Derive platform image reference
        id: image
        shell: bash
        run: |
          if [[ -n "${{ inputs.container_image }}" ]]; then
            IMAGE_URI="${{ inputs.container_image }}"
          elif [[ -n "${{ inputs.image_tag }}" ]]; then
            IMAGE_URI="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}-${{ env.DEPLOY_ENVIRONMENT }}-repo/${{ env.SERVICE_NAME }}:${{ inputs.image_tag }}"
          else
            IMAGE_URI="gcr.io/cloudrun/hello"
          fi

          echo "image_uri=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"
          echo "Preparing platform with image: ${IMAGE_URI}"

      - name: Terraform init with remote state
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ vars.TF_STATE_PREFIX != '' && vars.TF_STATE_PREFIX || 'dag-health-api/dev' }}"

      - name: Terraform plan platform changes
        run: |
          terraform plan \
            -input=false \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="region=${{ vars.GCP_REGION }}" \
            -var="environment=${{ env.DEPLOY_ENVIRONMENT }}" \
            -var="service_name=${{ env.SERVICE_NAME }}" \
            -var="image_tag=${{ inputs.image_tag != '' && inputs.image_tag || 'latest' }}" \
            -var="container_image=${{ steps.image.outputs.image_uri }}" \
            -out=tfplan

      - name: Terraform apply platform changes
        run: terraform apply -input=false -auto-approve tfplan

      - name: Next step guidance
        run: |
          echo "Platform preparation complete."
          echo "This workflow can use the Cloud Run sample image as a placeholder so platform prep stays independent of CI."
          echo "Next run CI to build and publish the application image, then run CD to deploy the desired artifact."
